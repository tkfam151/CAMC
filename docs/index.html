<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CAMC Seating</title>
  <meta name="description" content="Find your seat for CAMC auditorium events.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="gnav" aria-label="Global">
  <div class="wrap wrap-wide">
    <a class="brand" href="./">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v7H5V5a2 2 0 0 1 2-2zM3 13h18v3.5H3zM5 16.5h2.2V21H5zM16.8 16.5H19V21h-2.2z"/></svg></span>
      <span data-i18n="brand">CAMC Seating</span>
    </a>
    <div class="gnav-links">
      <a href="./" class="hide-sm" data-i18n="navEvents">Events</a>
      <a href="loykrathong/" data-i18n="navKrathong">Loy Krathong</a>
      <a href="teacher/" data-i18n="navTeacher">Teacher Sign In</a>
      <button class="lang-toggle" type="button" aria-label="Language">ไทย</button>
    </div>
  </div>
</nav>

<main id="app">
  <!-- Event list -->
  <section id="list-view" hidden>
    <div class="wrap wrap-wide">
      <header class="hero">
        <p class="eyebrow" data-i18n="heroEyebrow">Auditorium Seating</p>
        <h1 class="headline" data-i18n="heroTitle">Find your seat.</h1>
        <p class="subhead" data-i18n="heroSub">Search for an event to see exactly where every class and guest is sitting.</p>
        <div class="search search-lg">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="event-search" type="search" autocomplete="off" data-i18n-placeholder="searchEvents" data-i18n-aria="searchEvents" placeholder="Search events">
          <button class="clear" id="event-search-clear" type="button" aria-label="Clear" hidden><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </header>
      <div id="event-list" class="event-grid" aria-live="polite"></div>
      <p id="event-empty" class="empty" hidden></p>
    </div>
  </section>

  <!-- Single event -->
  <section id="event-view" hidden>
    <div class="wrap wrap-wide">
      <header class="event-head">
        <a class="back-link no-print" href="./" id="back-link">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span data-i18n="allEvents">All Events</span>
        </a>
        <h1 class="headline" id="ev-title" style="margin-top:14px"></h1>
        <div class="event-meta" id="ev-meta"></div>
      </header>

      <div class="stats" id="ev-stats">
        <div class="stat"><div class="stat-label" data-i18n="totalSeats">Capacity</div><div class="stat-value" id="st-total">0</div></div>
        <div class="stat"><div class="stat-label" data-i18n="allocated">Assigned</div><div class="stat-value" id="st-alloc">0</div></div>
        <div class="stat"><div class="stat-label" data-i18n="remaining">Available</div><div class="stat-value" id="st-remain">0</div></div>
        <div class="stat"><div class="stat-label" data-i18n="occupancy">Occupancy</div><div class="stat-value" id="st-rate">0%</div><div class="meter"><i id="st-meter"></i></div></div>
      </div>

      <div class="toolbar">
        <div class="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="seat-search" type="search" autocomplete="off" data-i18n-placeholder="findInChart" data-i18n-aria="findInChart">
          <button class="clear" id="seat-search-clear" type="button" aria-label="Clear" hidden><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <span class="result-note" id="result-note" aria-live="polite"></span>
        <span class="spacer"></span>
        <div class="segmented" role="group">
          <button type="button" id="lbl-num" aria-pressed="true" data-i18n="labelsNumbers">Numbers</button>
          <button type="button" id="lbl-cls" aria-pressed="false" data-i18n="labelsClasses">Classes</button>
        </div>
        <label class="range"><span data-i18n="zoom">Zoom</span><input type="range" id="zoom" min="14" max="36" value="24"></label>
        <button class="btn btn-secondary btn-sm" type="button" onclick="window.print()" data-i18n="print">Print</button>
      </div>

      <div class="legend" id="legend" style="margin-bottom:16px"></div>

      <section class="vip-section" id="vip-section" hidden>
        <h2 class="mini-title"><span class="star" aria-hidden="true">★</span> <span data-i18n="vipGuests">VIP Guests</span></h2>
        <div class="vip-list" id="vip-list"></div>
      </section>

      <div class="hall-card" id="hall-card">
        <div class="hall-scroll" id="hall"></div>
      </div>
    </div>
  </section>

  <div id="loading" class="loading"><div class="spinner"></div></div>
</main>

<footer class="foot">
  <div class="wrap wrap-wide">
    <span>CAMC Seating</span>
    <span>Developed by Panthira Thamsanit</span>
  </div>
</footer>

<script src="vendor/supabase-2.119.0.js"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/hall.js"></script>
<script src="js/viewer.js"></script>
</body>
</html>
